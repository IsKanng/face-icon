<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="round">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>

  <!-- 外框圆角方形底板 -->
  <rect x="4" y="4" width="192" height="192" rx="44" ry="44" fill="#2B2B2B" stroke="#1a1a1a" stroke-width="3"/>

  <!-- 粗白色内圈描边 -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- 粗黑色外圈 -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="#1a1a1a" stroke-width="6"/>

  <!-- Twitter 蓝色填充 -->
  <circle cx="100" cy="100" r="88" fill="#1DA1F2"/>

  <!-- 白色小鸟主体（简化圆润版） -->
  <g clip-path="url(#round)">
    <!-- 鸟身 - 圆润的椭圆 -->
    <ellipse cx="92" cy="118" rx="42" ry="30" fill="#ffffff"/>
    <!-- 翅膀 -->
    <path d="M60 100 Q40 78 65 65 Q82 56 95 70 L72 95 Z" fill="#ffffff"/>
    <!-- 尾巴 -->
    <path d="M130 112 Q155 95 165 108 Q152 110 140 118 Z" fill="#ffffff"/>

    <!-- 可爱的脸 - 眼睛 -->
    <ellipse cx="78" cy="112" rx="7" ry="8" fill="#1a1a1a"/>
    <ellipse cx="108" cy="112" rx="7" ry="8" fill="#1a1a1a"/>
    <!-- 眼睛高光 -->
    <circle cx="81" cy="109" r="2.8" fill="#ffffff"/>
    <circle cx="111" cy="109" r="2.8" fill="#ffffff"/>

    <!-- 嘴巴 - 开心的小嘴 -->
    <path d="M88 126 Q93 133 98 126" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

    <!-- 腮红 -->
    <ellipse cx="70" cy="122" rx="8" ry="5" fill="#F48FB1" opacity="0.55"/>
    <ellipse cx="116" cy="122" rx="8" ry="5" fill="#F48FB1" opacity="0.55"/>

    <!-- 翅膀上小小的爱心装饰 -->
    <path d="M52 88 Q50 83 54 83 Q58 83 56 88 Q54 83 50 83" fill="none" stroke="#FF5252" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
